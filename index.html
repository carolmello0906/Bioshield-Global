<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioShield Global | Carolina & Nicole</title>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg-app: radial-gradient(circle at 50% 0%, #0d3b38 0%, #081226 55%, #050811 100%);
      --card-bg: rgba(13, 22, 40, 0.94);
      --border-color: #10b981;
      --primary: #10b981;
      --secondary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --radius: 18px;
      --font-size: 15px;
      --letter-space: normal;
      --word-space: normal;
      --line-h: 1.55;
    }

    body.nivel-kids {
      --bg-app: linear-gradient(135deg, #38bdf8 0%, #34d399 50%, #facc15 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-color: #f97316;
      --primary: #ea580c;
      --secondary: #0284c7;
      --text-main: #1e293b;
      --text-muted: #334155;
      --radius: 28px;
      --font-size: 17px;
    }

    body.nivel-fund2 {
      --bg-app: radial-gradient(circle at top, #1e3a8a 0%, #064e3b 60%, #090d16 100%);
      --card-bg: rgba(15, 28, 46, 0.95);
      --border-color: #38bdf8;
      --primary: #38bdf8;
      --secondary: #34d399;
      --radius: 22px;
      --font-size: 16px;
    }

    body.nivel-super {
      --bg-app: radial-gradient(circle at top, #2e1065 0%, #090d16 75%);
      --card-bg: rgba(17, 15, 36, 0.96);
      --border-color: #a855f7;
      --primary: #c084fc;
      --secondary: #2dd4bf;
      --radius: 14px;
      --font-size: 15px;
    }

    body.modo-dislexia {
      --letter-space: 0.09em;
      --word-space: 0.18em;
      --line-h: 1.9;
      font-family: Verdana, Geneva, Tahoma, sans-serif !important;
    }
    body.modo-dislexia:not(.nivel-kids):not(.modo-tea) {
      --card-bg: #182032;
      --text-main: #fdfbf7;
    }

    body.modo-tdah .estrelas-bg { display: none !important; }
    body.modo-tdah .card { border-width: 3px; box-shadow: none !important; }

    body.modo-tea {
      --bg-app: #e2e8f0 !important;
      --card-bg: #f8fafc !important;
      --border-color: #64748b !important;
      --primary: #0f766e !important;
      --secondary: #0369a1 !important;
      --text-main: #1e293b !important;
      --text-muted: #475569 !important;
    }
    body.modo-tea .estrelas-bg { display: none !important; }
    body.modo-tea * { transition: none !important; animation: none !important; box-shadow: none !important; }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      letter-spacing: var(--letter-space);
      word-spacing: var(--word-space);
      line-height: var(--line-h);
    }

    body {
      margin: 0; padding: 14px; color: var(--text-main);
      background: var(--bg-app); min-height: 100vh; font-size: var(--font-size);
    }

    .estrelas-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: -1;
      background-image:
        radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 75% 15%, rgba(56,189,248,0.6), transparent),
        radial-gradient(1.5px 1.5px at 40% 70%, rgba(52,211,153,0.5), transparent),
        radial-gradient(2px 2px at 85% 65%, rgba(255,255,255,0.5), transparent);
    }

    .container { max-width: 980px; margin: 0 auto; }

    .acess-bar {
      max-width: 980px; margin: 0 auto 14px;
      background: rgba(10, 17, 32, 0.94); color: #ffffff;
      border: 1.5px solid rgba(56, 189, 248, 0.5); border-radius: 14px; padding: 8px 14px;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px;
    }
    .btn-acess {
      background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8;
      padding: 5px 9px; border-radius: 9px; font-weight: bold; font-size: 12px; cursor: pointer;
    }
    .btn-acess.ativo, .btn-acess:hover { background: #38bdf8; color: #070b14; }

    .capa-box {
      max-width: 560px; margin: 16px auto; background: var(--card-bg);
      border: 2px solid var(--border-color); border-radius: var(--radius);
      padding: 26px 22px; text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }
    .emblema-capa {
      width: 72px; height: 72px; margin: 0 auto 10px;
      background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(56,189,248,0.2));
      border: 2px solid var(--primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 32px;
    }
    .capa-box h1 { margin: 0 0 6px; color: var(--primary); font-size: 28px; }
    .subtitulo-capa { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
    .tag-autoras {
      display: inline-block; background: rgba(16, 185, 129, 0.15);
      border: 1.5px solid var(--primary); color: var(--primary);
      padding: 5px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 14px;
    }

    .lang-selector {
      display: flex; gap: 8px; justify-content: center; margin-bottom: 16px;
    }
    .lang-btn {
      flex: 1; padding: 8px; border-radius: 10px; border: 1.5px solid var(--primary);
      background: rgba(16, 185, 129, 0.08); color: var(--text-main);
      font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .lang-btn.active {
      background: var(--primary); color: #ffffff;
    }

    .auth-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .auth-tab {
      flex: 1; padding: 10px; border-radius: 12px; border: 1.5px solid var(--secondary);
      background: transparent; color: var(--text-main); font-weight: bold; cursor: pointer;
    }
    .auth-tab.active { background: var(--secondary); color: #ffffff; }

    input[type=text], input[type=password], select.campo {
      width: 100%; padding: 11px; margin: 7px 0; border-radius: 12px;
      border: 1.5px solid var(--secondary); background: rgba(15, 23, 42, 0.08);
      color: var(--text-main); font-size: 15px;
    }
    body:not(.nivel-kids):not(.modo-tea) input[type=text],
    body:not(.nivel-kids):not(.modo-tea) input[type=password],
    body:not(.nivel-kids):not(.modo-tea) select.campo {
      background: #09111e; color: #ffffff;
    }

    .check-inclusao {
      display: flex; align-items: center; gap: 10px;
      background: rgba(56, 189, 248, 0.08); border: 1px solid var(--secondary);
      padding: 8px 12px; border-radius: 11px; margin: 6px 0; cursor: pointer; text-align: left; font-size: 13.5px;
    }
    .check-inclusao input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }

    header {
      background: var(--card-bg); border: 2px solid var(--border-color);
      border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    }
    header h1 { margin: 0; font-size: 23px; color: var(--primary); }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }

    .nav-tabs { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-bottom: 16px; }
    .tab-btn {
      background: var(--card-bg); color: var(--text-main); border: 1.5px solid var(--secondary);
      padding: 9px 13px; border-radius: 16px; font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .tab-btn.active, .tab-btn:hover {
      background: linear-gradient(90deg, #10b981, #0ea5e9); color: #ffffff; border-color: #10b981;
    }
    body.nivel-kids .tab-btn.active { background: linear-gradient(90deg, #f97316, #ec4899); border-color: #f97316; }
    body.nivel-super .tab-btn.active { background: linear-gradient(90deg, #9333ea, #0d9488); border-color: #a855f7; }
    body.modo-tea .tab-btn.active { background: #0f766e !important; color: #ffffff !important; }

    .page { display: none; }
    .page.active { display: block; }

    .card {
      background: var(--card-bg); border: 2px solid var(--border-color);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    }
    h2 { color: var(--primary); margin-top: 0; font-size: 20px; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
    .sub-box {
      background: rgba(56, 189, 248, 0.08); border: 1.5px solid var(--secondary);
      border-radius: 14px; padding: 15px;
    }

    .btn-action {
      background: linear-gradient(90deg, #10b981, #0ea5e9); color: #ffffff;
      border: none; padding: 11px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 14px;
    }
    body.nivel-kids .btn-action { background: linear-gradient(90deg, #f97316, #ec4899); }
    body.nivel-super .btn-action { background: linear-gradient(90deg, #9333ea, #0d9488); }
    body.modo-tea .btn-action { background: #0f766e !important; }

    .btn-sec {
      background: rgba(56, 189, 248, 0.14); color: var(--text-main); border: 1.5px solid var(--secondary);
      padding: 8px 13px; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 4px; font-size: 13px;
    }

    .scanner-area {
      border: 2px dashed var(--primary); border-radius: 16px; padding: 18px; text-align: center;
    }
    #preview-img { max-width: 220px; max-height: 220px; border-radius: 14px; margin: 12px auto; display: none; border: 3px solid var(--secondary); }

    .chat-box {
      height: 250px; overflow-y: auto; background: rgba(15, 23, 42, 0.08); border: 1.5px solid var(--secondary);
      border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
    }
    body:not(.nivel-kids):not(.modo-tea) .chat-box { background: #060b14; }
